name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disposable SQLite database; nothing persists between runs.
      DATABASE_URL: file:/tmp/hello-ci.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma generate and push schema (SQLite)
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Build
        run: npm run build

      - name: Tests (node:test, Node 22)
        run: |
          set -euo pipefail
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            node --experimental-strip-types --experimental-sqlite --import ./tests/register.mjs --test "$f"
            echo "::endgroup::"
          done
