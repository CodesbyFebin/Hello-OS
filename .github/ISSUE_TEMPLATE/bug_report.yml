name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include what you expected to happen instead. }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, description: "OS, Node/Bun version, Docker or source" }
  - type: textarea
    id: logs
    attributes: { label: Redacted logs, description: Never paste keys, tokens or private data. }
