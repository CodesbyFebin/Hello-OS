name: Publish download portal

on:
  push:
    branches: [main]
    paths:
      - "download-site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble documentation and download portal
        run: |
          mkdir -p _site/downloads
          cp -a docs/. _site/
          cp -a download-site/. _site/downloads/
      - name: Upload download portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
