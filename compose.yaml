services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: file:/app/db/custom.db
      HELLO_PUBLIC_URL: ${HELLO_PUBLIC_URL:-http://localhost:3000}
      HELLO_OPERATOR_TOKEN: ${HELLO_OPERATOR_TOKEN:-}
      HELLO_OPERATOR_DEV_MODE: ${HELLO_OPERATOR_DEV_MODE:-}
    volumes:
      - hello-data:/app/db
    restart: unless-stopped

volumes:
  hello-data:
